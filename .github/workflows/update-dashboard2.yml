name: Update Dashboard 2

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: "Consultar todas as fontes, ignorando frequencia operacional"
        required: false
        default: "false"
      force_segment:
        description: "Segmento especifico: packaging, beverages, appliances ou consumer_goods"
        required: false
        default: ""
      dry_run:
        description: "Executar sem gerar/deployar arquivos"
        required: false
        default: "false"
      max_items:
        description: "Limite bruto de candidatos processados"
        required: false
        default: "5000"
      timeout_ms:
        description: "Timeout por URL em milissegundos"
        required: false
        default: "7000"
      segment_concurrency:
        description: "Frentes de pesquisa consultadas em paralelo"
        required: false
        default: "2"
      source_concurrency:
        description: "Fontes consultadas em paralelo por frente"
        required: false
        default: "2"

  schedule:
    - cron: "30 10 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Collect dashboard data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: >
          npm run collect:dashboard2 --
          max_items=${{ github.event.inputs.max_items || '5000' }}
          timeout_ms=${{ github.event.inputs.timeout_ms || '7000' }}
          segment_concurrency=${{ github.event.inputs.segment_concurrency || '2' }}
          source_concurrency=${{ github.event.inputs.source_concurrency || '2' }}
          force_all=${{ github.event.inputs.force_all || 'false' }}
          force_segment=${{ github.event.inputs.force_segment || '' }}
          dry_run=false

      - name: Build static dashboard
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm run build

      - name: Commit updated dashboard data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/dashboard2-latest.json
          git add public/exports/dashboard2-latest.csv
          git add public/exports/dashboard2-executive.pdf
          git add public/exports/dashboard2-full.pdf
          git add dist/index.html
          git add dist/data/dashboard2-latest.json
          git add dist/exports/dashboard2-latest.csv
          git add dist/exports/dashboard2-executive.pdf
          git add dist/exports/dashboard2-full.pdf

          if git diff --cached --quiet; then
            echo "Sem mudancas para commitar."
          else
            git commit -m "Atualizar Dashboard 2"
            git push
          fi

      - name: Upload latest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard2-run
          path: |
            public/data/dashboard2-latest.json
            public/exports/dashboard2-latest.csv
            public/exports/dashboard2-executive.pdf
            public/exports/dashboard2-full.pdf
            dist/index.html
          retention-days: 7
